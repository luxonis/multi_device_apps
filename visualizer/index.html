  <script>
    // Runs before first paint so a dark-theme session never flashes the light theme.
    // Mirrors ThemeProvider in @luxonis/depthai-viewer-common; keep the two in step.
    (function () {
      try {
        var stored = JSON.parse(localStorage.getItem('theme'));
        var dark = stored === 'dark' ||
          ((stored === 'system' || stored === null) &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
      } catch (e) {
        /* Private-mode localStorage or bad JSON: fall back to the light theme. */
      }
    })();
  </script>
